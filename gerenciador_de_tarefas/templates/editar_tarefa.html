{% extends "base.html" %} {% block title %}Editar Tarefa - Gerenciador de
Tarefas{% endblock %} {% block content %}

<div class="row justify-content-center mt-4">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="cartao">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Editar Tarefa</h2>
        <p class="text-secondary mb-0">Atualize os dados da tarefa</p>
      </div>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label" for="titulo">Título</label>
          <input
            type="text"
            id="titulo"
            name="titulo"
            class="form-control"
            value="{{ tarefa.titulo }}"
            required
            autofocus
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="descricao">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            class="form-control"
            rows="4"
            required
          >
{{ tarefa.descricao }}</textarea
          >
        </div>
        <div class="mb-4">
          <label class="form-label" for="status">Status</label>
          <select id="status" name="status" class="form-select">
            <option
              value="Pendente"
              {%
              if
              tarefa.status=""
              ="Pendente"
              %}selected{%
              endif
              %}
            >
              Pendente
            </option>
            <option
              value="Em andamento"
              {%
              if
              tarefa.status=""
              ="Em andamento"
              %}selected{%
              endif
              %}
            >
              Em andamento
            </option>
            <option
              value="Concluída"
              {%
              if
              tarefa.status=""
              ="Concluída"
              %}selected{%
              endif
              %}
            >
              Concluída
            </option>
            <option
              value="Cancelada"
              {%
              if
              tarefa.status=""
              ="Cancelada"
              %}selected{%
              endif
              %}
            >
              Cancelada
            </option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <a
            href="{{ url_for('quadro') }}"
            class="btn btn-outline-secondary w-50"
            style="border-radius: 10px; padding: 0.7rem 1rem"
            >Cancelar</a
          >
          <button type="submit" class="btn btn-principal w-50">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
