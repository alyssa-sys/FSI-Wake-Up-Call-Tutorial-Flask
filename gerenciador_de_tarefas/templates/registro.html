{% extends "base.html" %}
{% block title %}Registro - Gerenciador de Tarefas{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="cartao">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-1">Crie sua conta</h2>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" for="nomeUsuario">Nome de Usuário</label>
                    <input type="text" id="nomeUsuario" name="nomeUsuario" class="form-control"
                           placeholder="Ex.: alvaro123" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome / Apelido</label>
                    <input type="text" id="nome" name="nome" class="form-control"
                           placeholder="Como quer ser chamado">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="seuemail@gmail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control"
                           placeholder="Crie uma senha" required>
                </div>
                <button type="submit" class="btn btn-principal w-100">Registrar</button>
            </form>

            <p class="text-center text-secondary mt-4 mb-0">
                Já tem uma conta?
                <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">Faça login aqui</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
