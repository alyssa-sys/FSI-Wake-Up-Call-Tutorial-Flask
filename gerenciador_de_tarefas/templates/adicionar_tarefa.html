{% extends "base.html" %}
{% block title %}Adicionar Tarefa - Gerenciador de Tarefas{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="cartao">
            <div class="mb-4">
                <h2 class="fw-bold mb-1">Adicionar Tarefa</h2>
                <p class="text-secondary mb-0">Preencha os dados da nova tarefa</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" class="form-control"
                           placeholder="Ex.: Entregar seminário" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" class="form-control" rows="4"
                              placeholder="Descreva o que precisa ser feito" required></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="responsavel_id">Responsável</label>
                    <select id="responsavel_id" name="responsavel_id" class="form-select">
                        <option value="">Selecione um responsável</option>
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id }}">{{ usuario.nomeUsuario }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('quadro') }}" class="btn btn-outline-secondary w-50"
                       style="border-radius:10px; padding:.7rem 1rem;">Cancelar</a>
                    <button type="submit" class="btn btn-principal w-50">Adicionar</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
