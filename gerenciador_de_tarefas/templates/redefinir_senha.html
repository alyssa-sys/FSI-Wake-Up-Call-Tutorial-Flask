{% extends "base.html" %}
{% block title %}Nova senha - Gerenciador de Tarefas{% endblock %}
{% block content %}

<div class="lc-page">
  <div class="lc-hero">
    <section class="lc-intro">
      <h1 class="lc-headline">Crie uma nova senha.</h1>
      <p class="lc-sub">
        Escolha uma senha que você ainda não usou por aqui. Depois é só entrar de novo.
      </p>
    </section>

    <section class="lc-card lc-card-centro">
      <h2 class="lc-titulo">Nova senha</h2>
      <p class="lc-desc">Mínimo de 6 caracteres.</p>

      <form method="POST" action="{{ url_for('redefinir_senha', token=token) }}">
        <div class="lc-campo">
          <label for="senha">Nova senha</label>
          <div class="lc-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              type="password"
              id="senha"
              name="senha"
              class="form-control lc-input lc-input-senha"
              placeholder="Nova senha"
              autocomplete="new-password"
              minlength="6"
              required
              autofocus
            />
            <button type="button" class="lc-mostrar" id="verSenha">Mostrar</button>
          </div>
        </div>

        <div class="lc-campo">
          <label for="confirmar_senha">Confirmar nova senha</label>
          <div class="lc-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              type="password"
              id="confirmar_senha"
              name="confirmar_senha"
              class="form-control lc-input"
              placeholder="Repita a nova senha"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-principal lc-entrar w-100">
          Salvar nova senha
        </button>
      </form>

      <p class="lc-rodape">
        <a href="{{ url_for('login') }}">Voltar ao login</a>
      </p>
    </section>
  </div>
</div>

<script>
  document.getElementById("verSenha").addEventListener("click", function () {
    var mostrar = document.getElementById("senha").type === "password";
    ["senha", "confirmar_senha"].forEach(function (id) {
      document.getElementById(id).type = mostrar ? "text" : "password";
    });
    this.textContent = mostrar ? "Ocultar" : "Mostrar";
  });
</script>
{% endblock %}
